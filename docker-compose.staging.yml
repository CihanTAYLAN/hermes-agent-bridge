name: hermes-bridge-staging

x-traefik-labels: &traefik-labels
  - traefik.enable=true
  - traefik.http.routers.hermes-bridge-staging.rule=Host(`${BRIDGE_STAGING_HOST:?Set staging hostname}`)
  - traefik.http.routers.hermes-bridge-staging.entrypoints=websecure
  - traefik.http.routers.hermes-bridge-staging.tls=true
  - traefik.http.routers.hermes-bridge-staging.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
  - traefik.http.services.hermes-bridge-staging.loadbalancer.server.port=3000
  - traefik.http.services.hermes-bridge-staging.loadbalancer.healthcheck.path=/readyz
  - traefik.http.services.hermes-bridge-staging.loadbalancer.healthcheck.interval=15s
  - traefik.docker.network=${DOKPLOY_NETWORK:-dokploy-network}

services:
  api:
    # Promotion is digest-only: BRIDGE_IMAGE_DIGEST must be registry/name@sha256:<64 hex>.
    image: ${BRIDGE_IMAGE_DIGEST:?Set an immutable registry/name@sha256 digest}
    pull_policy: always
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set the staging PostgreSQL URL}
      BRIDGE_REQUESTS_ENABLED: "false"
      BRIDGE_AGENT_ALPHA_ACTIVE_SECRET: ${BRIDGE_AGENT_ALPHA_ACTIVE_SECRET:?Set Alpha ingress HMAC secret}
      BRIDGE_AGENT_ALPHA_PREVIOUS_SECRET: ${BRIDGE_AGENT_ALPHA_PREVIOUS_SECRET:-}
      BRIDGE_AGENT_BETA_ACTIVE_SECRET: ${BRIDGE_AGENT_BETA_ACTIVE_SECRET:?Set Beta ingress HMAC secret}
      BRIDGE_AGENT_BETA_PREVIOUS_SECRET: ${BRIDGE_AGENT_BETA_PREVIOUS_SECRET:-}
      BRIDGE_TO_ALPHA_WEBHOOK_URL: ${BRIDGE_TO_ALPHA_WEBHOOK_URL:?Set Alpha private webhook URL}
      BRIDGE_TO_ALPHA_WEBHOOK_ACTIVE_SECRET: ${BRIDGE_TO_ALPHA_WEBHOOK_ACTIVE_SECRET:?Set Alpha webhook secret}
      BRIDGE_TO_BETA_WEBHOOK_URL: ${BRIDGE_TO_BETA_WEBHOOK_URL:?Set Beta private webhook URL}
      BRIDGE_TO_BETA_WEBHOOK_ACTIVE_SECRET: ${BRIDGE_TO_BETA_WEBHOOK_ACTIVE_SECRET:?Set Beta webhook secret}
      BRIDGE_PAYLOAD_KEY_VERSION: ${BRIDGE_PAYLOAD_KEY_VERSION:?Set current payload key version}
      BRIDGE_PAYLOAD_PREVIOUS_KEY_VERSION: ${BRIDGE_PAYLOAD_PREVIOUS_KEY_VERSION:-}
      BRIDGE_PAYLOAD_KEY_V2_BASE64: ${BRIDGE_PAYLOAD_KEY_V2_BASE64:-}
      BRIDGE_PAYLOAD_KEY_V1_BASE64: ${BRIDGE_PAYLOAD_KEY_V1_BASE64:?Set current 32-byte base64 payload key}
      BRIDGE_PAYLOAD_KEY_V0_BASE64: ${BRIDGE_PAYLOAD_KEY_V0_BASE64:-}
      BRIDGE_METRICS_TOKEN: ${BRIDGE_METRICS_TOKEN:?Set metrics bearer token}
      BRIDGE_MAX_BODY_BYTES: ${BRIDGE_MAX_BODY_BYTES:-65536}
      BRIDGE_RATE_LIMIT_PER_SECOND: ${BRIDGE_RATE_LIMIT_PER_SECOND:-10}
      BRIDGE_REPLAY_WINDOW_SECONDS: ${BRIDGE_REPLAY_WINDOW_SECONDS:-300}
      BRIDGE_WORKER_POLL_INTERVAL_MS: ${BRIDGE_WORKER_POLL_INTERVAL_MS:-250}
      BRIDGE_WORKER_BATCH_SIZE: ${BRIDGE_WORKER_BATCH_SIZE:-20}
      BRIDGE_WORKER_LEASE_SECONDS: ${BRIDGE_WORKER_LEASE_SECONDS:-30}
      BRIDGE_WORKER_MAX_ATTEMPTS: ${BRIDGE_WORKER_MAX_ATTEMPTS:-8}
      BRIDGE_WORKER_BASE_DELAY_MS: ${BRIDGE_WORKER_BASE_DELAY_MS:-500}
      BRIDGE_WORKER_MAX_DELAY_MS: ${BRIDGE_WORKER_MAX_DELAY_MS:-30000}
      BRIDGE_DELIVERY_TIMEOUT_MS: ${BRIDGE_DELIVERY_TIMEOUT_MS:-5000}
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>{if(!r.ok)throw Error(r.status)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    restart: unless-stopped
    labels: *traefik-labels
    networks:
      - edge
    deploy:
      replicas: 1
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
        parallelism: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
      labels: *traefik-labels

networks:
  edge:
    external: true
    name: ${DOKPLOY_NETWORK:-dokploy-network}
