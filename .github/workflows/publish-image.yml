name: publish-image

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish immutable GHCR image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve revision
        id: revision
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          revision="$WORKFLOW_RUN_SHA"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "revision must be a full commit SHA" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
          echo "short_sha=${revision:0:12}" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Check out verified revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ steps.revision.outputs.sha }}

      - name: Require revision on main
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REVISION" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          push: true
          tags: ${{ steps.revision.outputs.image }}:sha-${{ steps.revision.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.revision.outputs.image }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "build did not return a valid image digest" >&2
            exit 1
          fi
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-ref.txt
          {
            echo '## Immutable image published'
            echo
            echo "- Revision: \`$REVISION\`"
            echo "- Image: \`$IMAGE@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-ref-${{ steps.revision.outputs.short_sha }}
          path: image-ref.txt
          if-no-files-found: error
          retention-days: 30
