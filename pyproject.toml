[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-agent-bridge-outbound"
version = "0.1.0"
description = "Durable signed outbound event plugin for Hermes Agent"
requires-python = ">=3.13"
dependencies = ["cryptography>=46.0.0"]

[project.optional-dependencies]
dev = [
  "jsonschema[format]>=4.25.0",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "PyYAML>=6.0.2",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hermes-plugin/hermes_bridge_outbound"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["hermes-plugin/tests"]
pythonpath = ["hermes-plugin"]

[tool.coverage.run]
branch = true
source = ["hermes_bridge_outbound"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["hermes-plugin"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "hermes-plugin"
packages = ["hermes_bridge_outbound"]
exclude = ["hermes-plugin/tests"]
warn_unreachable = true
